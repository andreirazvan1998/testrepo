name: Create Draft PR

on:
  push:
    branches:
      - '**'  # Runs on all branches

permissions:
  pull-requests: write

jobs:
  create_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check if PR exists
        id: pr_check
        run: |
          PR_URL=$(gh pr list --head ${{ github.ref_name }} --state open --json url -q '.[0].url')
          if [ -z "$PR_URL" ]; then
            echo "No PR found, will create a new one."
            echo "PR_EXISTS=false" >> $GITHUB_ENV
          else
            echo "PR found, skipping creation."
            echo "PR_EXISTS=true" >> $GITHUB_ENV
            echo "PR_URL=$PR_URL" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Set the token here for gh CLI

      - name: Create Pull Request as Draft
        id: create_pr
        if: env.PR_EXISTS == 'false'
        run: |
          PR_OUTPUT=$(gh pr create -B main -H ${{ github.ref_name }} --title 'Merge ${{ github.ref_name }} into main' --body 'Created by GitHub action' --draft)
          echo "PR created: $PR_OUTPUT"
          # Extract PR number from the output
          PR_NUMBER=$(echo "$PR_OUTPUT" | grep -oP '#\K\d+')
          echo "PR created with number: $PR_NUMBER"
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 

      - name: Trigger controlrepo workflow
        if: env.PR_EXISTS == 'false'
        run: |
          curl -X POST -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.CONTROLREPO_ACCESS_TOKEN }}" \
          https://api.github.com/repos/andreirazvan1998/controlrepo/dispatches \
          -d '{
            "event_type": "update-pr-status",
            "client_payload": {
              "action": "push",
              "pr_name": "PR-${{ env.PR_NUMBER }}",
              "test_status": "pending"
            }
          }'
