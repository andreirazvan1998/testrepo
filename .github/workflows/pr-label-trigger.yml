name: Trigger PR Test on Label Change

on:
  pull_request:
    types:
      - opened  # Trigger only when PR is opened

jobs:
  trigger_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log PR information
        run: |
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "PR Number: ${{ github.event.pull_request.number }}"

      - name: Trigger Test Workflow
        run: |
          echo "Triggering test workflow because the PR is opened."
          gh workflow run pr-test-and-label-update.yml --ref ${{ github.head_ref }}
