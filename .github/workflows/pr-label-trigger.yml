name: Trigger PR Test and Label Update

on:
  pull_request:
    types:
      - ready_for_review  # Triggered when PR is moved from Draft to Open

jobs:
  handle_labels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  # Use the latest stable version of actions/checkout

      - name: Set GH_TOKEN environment variable
        run: echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Checkout the PR branch explicitly
        run: |
          git fetch origin ${{ github.head_ref }}  # Fetch the PR branch
          git checkout ${{ github.head_ref }}  # Checkout the PR branch

      - name: Get Pull Request Number
        id: pr
        run: |
          PR_NUMBER=$(gh pr view --json number -q .number || echo "")
          if [ -z "$PR_NUMBER" ]; then
            echo "❌ No PR number found."
            exit 1
          else
            echo "PR_NUMBER=${PR_NUMBER}" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Python Script to Get Test Result
        id: get_test_result
        run: |
          PR_NUMBER="PR-${{ env.PR_NUMBER }}"
          RESULT=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/andreirazvan1998/controlrepo/pr_status.json)
          echo "Test result for PR ${PR_NUMBER}: $RESULT"
          echo "test_result=${RESULT}" >> $GITHUB_ENV

      - name: Check if the PR needs to be moved to draft
        run: |
          if [ "${{ env.test_result }}" == "fail" ]; then
            echo "✅ Test failed, moving PR to draft."
            gh pr ready --undo ${{ env.PR_NUMBER }}
          else
            echo "❌ Test passed or no result, no action needed."
          fi

      - name: Handle PR status based on test result
        run: |
          if [ "${{ env.test_result }}" == "fail" ]; then
            echo "The PR has failed tests and was moved to draft."
          else
            echo "The PR passed the tests or no failure was detected."
