name: Trigger PR Test on Label Change

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review  # Listen for ready_for_review event

jobs:
  trigger_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set GH_TOKEN environment variable
        run: echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Get PR Number and Labels
        id: get_pr_info
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          # Explicitly set GH_TOKEN in the environment variable for gh
          export GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          LABELS=$(gh pr view $PR_NUMBER --json labels -q '.labels[].name')
          CURRENT_BRANCH=${{ github.head_ref }}  # Get the current branch of the PR
          PR_STATE=${{ github.event.pull_request.state }}  # Get the PR state (open, closed, etc.)
          echo "PR Number: $PR_NUMBER"
          echo "Labels: $LABELS"
          echo "Current Branch: $CURRENT_BRANCH"
          echo "PR State: $PR_STATE"
          echo "LABELS=$LABELS" >> $GITHUB_ENV
          echo "CURRENT_BRANCH=$CURRENT_BRANCH" >> $GITHUB_ENV
          echo "PR_STATE=$PR_STATE" >> $GITHUB_ENV

      - name: Trigger Test Workflow
        run: |
          echo "Evaluating PR state and labels..."
          echo "PR State: $PR_STATE"
          echo "Labels: $LABELS"
          
          # Check if the PR is open and the label contains 'tests-failed'
          if [[ "$PR_STATE" == "open" ]] && [[ "$LABELS" == *"tests-failed"* ]]; then
            echo "Triggering the test run because the label is 'tests-failed' and PR is open."
            curl -X POST -u "token:${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              --data '{"ref":"refs/heads/'"${CURRENT_BRANCH}"'"}' \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/pr-test-and-label-update.yml/dispatches
          else
            echo "Skipping trigger: Either PR is not open or label is not 'tests-failed'."
          fi
