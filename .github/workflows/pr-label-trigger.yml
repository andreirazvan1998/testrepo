name: Trigger PR Test on Label Change

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review  # Listen for ready_for_review event

jobs:
  trigger_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set GH_TOKEN environment variable
        run: echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Get PR Number and Labels
        id: get_pr_info
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          # Explicitly set GH_TOKEN in the environment variable for gh
          export GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          CURRENT_BRANCH=${{ github.head_ref }}  # Get the current branch of the PR
          echo "PR Number: $PR_NUMBER"
          echo "Current Branch: $CURRENT_BRANCH"
          echo "CURRENT_BRANCH=$CURRENT_BRANCH" >> $GITHUB_ENV

      - name: Trigger Test Workflow Unconditionally
        run: |
          echo "Triggering the test run unconditionally"
          curl -L \
          -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type": "trigger-pr-test"}'


