name: Trigger PR Test and Label Update

on:
  pull_request:
    types:
      - ready_for_review  # Triggered when PR is moved from Draft to Open

jobs:
  trigger_pr_test:
    runs-on: ubuntu-latest

    steps:
      - name: Set GH_TOKEN environment variable
        run: echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Debug - Check if the necessary variables are set
        run: |
          echo "GITHUB_TOKEN is set: ${{ secrets.GITHUB_TOKEN != '' }}"
          echo "Repository: ${{ github.repository }}"
          echo "Event Type: trigger-pr-test"

      - name: Trigger Test Workflow Unconditionally
        run: |
          echo "Triggering the test run unconditionally"
          gh workflow run pr-test-and-label-update.yml --ref test3