name: Trigger PR Test and Label Update

on:
  pull_request:
    types:
      - ready_for_review  # Triggered when PR is moved from Draft to Open

jobs:
  handle_labels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  # Use the latest stable version of actions/checkout

      - name: Set GH_TOKEN environment variable
        run: echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Get Pull Request Number
        id: pr
        run: |
          PR_NUMBER=$(gh pr view --json number -q .number || echo "")
          if [ -z "$PR_NUMBER" ]; then
            echo "❌ No PR number found."
            exit 1
          else
            echo "PR_NUMBER=${PR_NUMBER}" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR test result from control repo
        id: get_test_result
        run: |
          echo "Fetching test result for PR-${{ env.PR_NUMBER }}..."

          # Make an initial request to the control repo to get the test status
          RESPONSE=$(curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.CONTROLREPO_ACCESS_TOKEN }}" \
            https://api.github.com/repos/andreirazvan1998/controlrepo/dispatches \
            -d '{
                  "event_type": "update-pr-status",
                  "client_payload": {
                    "action": "get",
                    "pr_name": "PR-${{ env.PR_NUMBER }}"
                  }
                }')

          # Retry mechanism (polling) for a response from the control repo API
          MAX_RETRIES=5
          RETRY_COUNT=0
          TEST_RESULT=""
          while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do
            TEST_RESULT=$(echo $RESPONSE | jq -r '.client_payload.test_status')

            if [ "$TEST_RESULT" != "null" ]; then
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT+1))
            echo "Waiting for test result... Retry #$RETRY_COUNT"
            sleep 5  # Wait 5 seconds before retrying
            RESPONSE=$(curl -s -X POST \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: token ${{ secrets.CONTROLREPO_ACCESS_TOKEN }}" \
              https://api.github.com/repos/andreirazvan1998/controlrepo/dispatches \
              -d '{
                    "event_type": "update-pr-status",
                    "client_payload": {
                      "action": "get",
                      "pr_name": "PR-${{ env.PR_NUMBER }}"
                    }
                  }')
          done

          if [ "$TEST_RESULT" == "null" ]; then
            echo "❌ No test result received after $MAX_RETRIES retries."
            exit 1
          else
            echo "Test result for PR-${{ env.PR_NUMBER }}: $TEST_RESULT"
            echo "test_status=${TEST_RESULT}" >> $GITHUB_ENV
          fi

      - name: Handle PR status based on test result
        run: |
          if [ "${{ env.test_status }}" == "test-failed" ]; then
            echo "✅ 'test-failed' found, putting the PR back to draft."
            gh pr ready --undo ${{ github.event.pull_request.number }}
          else
            echo "❌ 'test-failed' not found, no action needed."
          fi
