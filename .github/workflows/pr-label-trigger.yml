name: Trigger PR Test and Label Update

on:
  pull_request:
    types:
      - ready_for_review  # Triggered when PR is moved from Draft to Open

jobs:
  handle_labels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  # Use the latest stable version of actions/checkout

      - name: Set GH_TOKEN environment variable
        run: echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Checkout the PR branch explicitly
        run: |
          git fetch origin ${{ github.head_ref }}  # Fetch the PR branch
          git checkout ${{ github.head_ref }}  # Checkout the PR branch

      - name: Get Pull Request Number
        id: pr
        run: |
          PR_NUMBER=$(gh pr view --json number -q .number || echo "")
          if [ -z "$PR_NUMBER" ]; then
            echo "❌ No PR number found."
            exit 1
          else
            echo "PR_NUMBER=${PR_NUMBER}" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Python Script to Get Test Result
        id: get_test_result
        run: |
          PR_NUMBER="PR-${{ env.PR_NUMBER }}"
          RESULT=$(curl -s -H "Authorization: token ${{ secrets.CONTROLREPO_ACCESS_TOKEN }}" \
            "https://api.github.com/repos/andreirazvan1998/controlrepo/contents/pr_status.json?ref=master")  # Change `main` to the correct branch

          if [[ $(echo "$RESULT" | jq -r '.message') == "Not Found" ]]; then
            echo "❌ pr_status.json file not found. Please check the file path and branch."
            exit 1
          fi

          # Extract the base64 encoded content from the response
          BASE64_CONTENT=$(echo "$RESULT" | jq -r '.content')

          # Remove any newline characters from the base64 string (if any)
          BASE64_CONTENT=$(echo "$BASE64_CONTENT" | tr -d '\n')

          # Call the Python script to decode the base64 content and get the test result
          DECODED_CONTENT=$(python3 decode_base64.py "${PR_NUMBER}" "${BASE64_CONTENT}")

          # Output decoded content and store it in the environment variable
          echo "Decoded content for PR ${PR_NUMBER}: $DECODED_CONTENT"
          echo "test_result=${DECODED_CONTENT}" >> $GITHUB_ENV
      - name: Check if the PR needs to be moved to draft
        run: |
          if [ "${{ env.test_result }}" == "test-failed" ]; then
            echo "✅ Test failed, moving PR to draft."
            gh pr ready --undo ${{ env.PR_NUMBER }}
          else
            echo "❌ Test passed, no action needed."
          fi

      - name: Handle PR status based on test result
        run: |
          if [ "${{ env.test_result }}" == "fail" ]; then
            echo "The PR has failed tests and was moved to draft."
          else
            echo "The PR passed the tests or no failure was detected."
