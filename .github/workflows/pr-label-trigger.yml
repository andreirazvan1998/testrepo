name: Trigger PR Test and Label Update

on:
  pull_request:
    types:
      - ready_for_review  # Triggered when PR is moved from Draft to Open

jobs:
  handle_labels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  # Use the latest stable version of actions/checkout

      - name: Set GH_TOKEN environment variable
        run: echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Check if the PR is labeled 'tests-failed'
        id: check_labels
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          LABELS=$(gh pr view $PR_NUMBER --json labels -q '.labels[].name')
          echo "Current labels: $LABELS"
          if echo "$LABELS" | grep -q "tests-failed"; then
            echo "✅ 'tests-failed' label found, putting the PR back to draft."
            echo "move_to_draft=true" >> $GITHUB_ENV
            # Put the PR back to draft if 'tests-failed' label is present
            gh pr ready --undo $PR_NUMBER
          else
            echo "❌ 'tests-failed' label not found, no action needed."
            echo "move_to_draft=false" >> $GITHUB_ENV
          fi

      - name: Handle PR status based on label
        run: |
          if [ "${{ env.move_to_draft }}" == "true" ]; then
            echo "The PR was moved to draft due to the 'tests-failed' label."
          else
            echo "No action was required as the PR does not have the 'tests-failed' label."
          fi
