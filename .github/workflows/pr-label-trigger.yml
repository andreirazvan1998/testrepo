name: Trigger PR Test on Label Change

on:
  push:
    branches:
      - main  # Trigger on every push to the main branch (adjust to your branch as needed)
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review  # Trigger when PR is moved to 'Ready for Review'

jobs:
  trigger_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set GH_TOKEN environment variable
        run: echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Get PR Number and Labels
        id: get_pr_info
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          # Explicitly set GH_TOKEN in the environment variable for gh
          export GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          LABELS=$(gh pr view $PR_NUMBER --json labels -q '.labels[].name')
          CURRENT_BRANCH=${{ github.head_ref }}  # Get the current branch of the PR
          echo "PR Number: $PR_NUMBER"
          echo "Labels: $LABELS"
          echo "Current Branch: $CURRENT_BRANCH"
          echo "LABELS=$LABELS" >> $GITHUB_ENV
          echo "CURRENT_BRANCH=$CURRENT_BRANCH" >> $GITHUB_ENV

      - name: Debugging Labels
        run: |
          echo "Current labels: $LABELS"
          if [[ "$LABELS" == *"tests-failed"* ]]; then
            echo "The label 'tests-failed' is present!"
          else
            echo "The label 'tests-failed' is NOT present."
          fi

      - name: Trigger Test Workflow if Label is `tests-failed`
        run: |
          gh workflow run pr-test-and-label-update.yml --ref ${{ github.head_ref }}
