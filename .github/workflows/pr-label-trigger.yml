name: Trigger PR Test and Label Update

on:
  pull_request:
    types:
      - ready_for_review  # Triggered when PR is moved from Draft to Open

jobs:
  trigger_pr_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  # Use the latest stable version of actions/checkout

      - name: Set GH_TOKEN environment variable
        run: echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Debug - Check if the necessary variables are set
        run: |
          echo "GITHUB_TOKEN is set: ${{ secrets.GITHUB_TOKEN != '' }}"
          echo "Repository: ${{ github.repository }}"
          echo "Event Type: trigger-pr-test"
          echo "PR Number: ${{ github.event.pull_request.number }}"

      - name: Check if the PR is open and labeled 'tests-failed'
        id: check_labels
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          LABELS=$(gh pr view $PR_NUMBER --json labels -q '.labels[].name')
          echo "Current labels: $LABELS"
          if echo "$LABELS" | grep -q "tests-failed"; then
            echo "✅ 'tests-failed' label found, triggering the workflow."
            echo "trigger=true" >> $GITHUB_ENV
          else
            echo "❌ 'tests-failed' label not found, skipping the workflow trigger."
            echo "trigger=false" >> $GITHUB_ENV

      - name: Trigger Test Workflow Unconditionally
        if: env.trigger == 'true'  # Only trigger if the PR is open and labeled 'tests-failed'
        run: |
          echo "Triggering the test run unconditionally"
          gh workflow run pr-test-and-label-update.yml --ref ${{ github.head_ref }}
