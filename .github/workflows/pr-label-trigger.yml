name: Trigger PR Test and Label Update

on:
  pull_request:
    types:
      - ready_for_review  # Triggered when PR is moved from Draft to Open

jobs:
  handle_labels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  # Use the latest stable version of actions/checkout

      - name: Set GH_TOKEN environment variable
        run: echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Get PR number
        id: pr
        run: |
          PR_NUMBER=$(gh pr view --json number -q .number || echo "")
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Python script in controlrepo
        id: trigger_controlrepo
        run: |
          curl -X POST -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/andreirazvan1998/controlrepo/dispatches \
          -d '{
            "event_type": "update-pr-status",
            "client_payload": {
              "pr_number": "${{ env.PR_NUMBER }}",
              "flag": "get"
            }
          }'

      - name: Wait for result from controlrepo (Fetch pr_status.json)
        id: get_result
        run: |
          # Wait for the response from the Python script in controlrepo
          # Here, we fetch the pr_status.json file and extract the result
          
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          -O "https://raw.githubusercontent.com/andreirazvan1998/controlrepo/master/pr_status.json"

          # Extract the result from pr_status.json for the PR number
          PR_RESULT=$(jq -r ".\"${{ env.PR_NUMBER }}\".status" pr_status.json)

          echo "Test result: $PR_RESULT"
          
          if [[ "$PR_RESULT" == "pass" ]]; then
            echo "Test passed!"
            echo "test_status=pass" >> $GITHUB_ENV
          elif [[ "$PR_RESULT" == "fail" ]]; then
            echo "Test failed!"
            echo "test_status=fail" >> $GITHUB_ENV
          else
            echo "Test result not available or error occurred."
            echo "test_status=error" >> $GITHUB_ENV
          fi

      - name: Handle PR status based on test result
        run: |
          if [ "${{ env.test_status }}" == "fail" ]; then
            echo "Tests failed. Moving PR to draft."
            gh pr ready --undo ${{ env.PR_NUMBER }}
          elif [ "${{ env.test_status }}" == "pass" ]; then
            echo "Tests passed. No action needed."
          else
            echo "Unknown test result. No action taken."
          fi
