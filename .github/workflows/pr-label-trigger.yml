name: Trigger PR Test on Label Change

on:
  pull_request:
    types:
      - opened  # Trigger only when PR is opened
      - ready_for_review  # Trigger when PR is ready for review

jobs:
  trigger_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate GitHub CLI
        run: |
          # Clear any existing GH_TOKEN environment variable before using the GitHub CLI
          unset GH_TOKEN
          gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Log PR information
        run: |
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "Ref for PR: ${{ github.head_ref }}"

      - name: Trigger Test Workflow
        run: |
          echo "Triggering test workflow because the PR is opened or ready for review."
          curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token YOUR_GITHUB_TOKEN" \
          -d '{"ref": "refs/heads/BRANCH_NAME"}' \
          https://api.github.com/repos/OWNER/REPO/actions/workflows/pr-test-and-label-update.yml/dispatches

