name: Run Pytest on PR

on:
  push:
    branches:
      - '**'  # Runs on every push
  pull_request:
    types:
      - ready_for_review  # Trigger when PR moves from draft to open
  workflow_dispatch:  # Allows manual execution

permissions:
  pull-requests: write

jobs:

  unit_tests:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'tests-passed'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Unit Tests
        id: pytest
        run: |
          echo "Running unit tests..."
          pytest test_script.py || echo "Tests failed" > pytest-status.txt
          cat pytest-status.txt  # Debugging line to show contents of pytest-status.txt

      - name: Get PR URL (Only for push events)
        id: pr_url
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          PR_URL=$(gh pr list --head "${{ github.ref_name }}" --state open --json url -q '.[0].url' || echo "")
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV
          echo "PR URL: $PR_URL"  # Debugging line

      - name: Handle Labeling and Drafting PR based on Test Results
        if: github.event_name == 'push' && env.PR_URL != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if tests passed or failed..."
          
          # Debugging the file contents
          echo "Contents of pytest-status.txt: $(cat pytest-status.txt)"
          
          # Check if pytest passed or failed by checking the result file
          if test -f pytest-status.txt && grep -q "Tests failed" pytest-status.txt; then
            echo "❌ Unit tests failed. Moving PR back to draft and adding 'tests-failed' label."
            gh pr ready --undo "$PR_URL"
            gh pr comment "$PR_URL" --body "🚨 Unit tests failed. Moving PR back to draft."

            # Remove the 'tests-passed' label if it exists
            gh pr edit "$PR_URL" --remove-label "tests-passed" || echo "'tests-passed' label not found"
            gh pr edit "$PR_URL" --add-label "tests-failed" || echo "Failed to add 'tests-failed' label"
          else
            echo "✅ Unit tests passed."
            # If tests passed, remove the 'tests-failed' label and add 'tests-passed'
            gh pr edit "$PR_URL" --remove-label "tests-failed" || echo "'tests-failed' label not found"
            gh pr edit "$PR_URL" --add-label "tests-passed" || echo "Failed to add 'tests-passed' label"
            
            # Add comment indicating success
            gh pr comment "$PR_URL" --body "✅ Unit tests passed. They won't rerun when PR is reopened."

  e2e_tests:
    needs: unit_tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Verify PR is Open and Label Check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          PR_URL="${{ github.event.pull_request.html_url }}"
          
          # Check if the PR is open and has the 'tests-passed' label
          PR_STATE=$(gh pr view "$PR_URL" --json state -q ".state")
          HAS_LABEL=$(gh pr view "$PR_URL" --json labels -q '.labels[].name' | grep -c "tests-passed")

          if [[ "$PR_STATE" != "OPEN" ]]; then
            echo "❌ PR is not open. Cancelling E2E tests."
            exit 1
          elif [[ "$HAS_LABEL" -gt 0 ]]; then
            echo "✅ PR has 'tests-passed' label. Skipping E2E tests."
            exit 0
          else
            echo "❌ PR is open but no 'tests-passed' label found. Running E2E tests."
          fi

      - name: Run E2E Tests
        ru
