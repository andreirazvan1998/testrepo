name: Run Pytest on PR

on:
  push:
    branches:
      - '**'  # Runs on all branches
  pull_request:
    types:
      - ready_for_review  # Trigger when PR is moved from draft to open
  workflow_dispatch:  # Allows manual execution of tests

permissions:
  pull-requests: write

jobs:
  
  e2e_tests:
    needs: unit_tests  # Make sure unit tests have run successfully
    if: |
      github.event_name == 'pull_request' && 
      github.event.pull_request.state == 'open' && 
      contains(github.event.pull_request.labels.*.name, 'tests-passed') && 
      success()  # Ensure previous tests have passed
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Verify PR is Open and has 'tests-passed' label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          # Fetch PR data and check if it is open and labeled 'tests-passed'
          PR_STATE=$(gh pr view "${{ github.event.pull_request.number }}" --json state -q ".state")
          PR_LABELS=$(gh pr view "${{ github.event.pull_request.number }}" --json labels -q '.labels[].name')
          
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "❌ PR is not open. Cancelling E2E tests."
            exit 1
          elif [[ ! "$PR_LABELS" =~ "tests-passed" ]]; then
            echo "❌ 'tests-passed' label not found. Cancelling E2E tests."
            exit 1
          else
            echo "✅ PR is open and has 'tests-passed' label. Proceeding with E2E tests."
          fi

      - name: Run E2E Tests
        run: pytest e2etests.py

      - name: Notify Users for Review
        if: success()  # Run only if E2E tests pass
        run: |
          echo "✅ E2E tests passed. Notifying users for review."
          gh pr review ${{ github.event.pull_request.number }} --approve --body "Tests passed, ready for review."
