name: Run Pytest on PR

on:
  push:
    branches:
      - '**'  # Runs on every push
  pull_request:
    types:
      - ready_for_review  # Trigger when PR moves from draft to open
  workflow_dispatch:  # Allows manual execution

permissions:
  pull-requests: write

jobs:

  unit_tests:
    runs-on: ubuntu-latest
    # Temporarily remove the condition to ensure the tests run
    # if: |
    #   github.event_name == 'push' || 
    #   (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'tests-passed'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."  # Debugging line
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Unit Tests
        id: pytest
        run: |
          echo "Running unit tests..."  # Debugging line
          pytest test_script.py || echo "Tests failed" > pytest-status.txt
          cat pytest-status.txt  # Debugging line to show contents of pytest-status.txt

      - name: Get PR URL (Only for push events)
        id: pr_url
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          PR_URL=$(gh pr list --head "${{ github.ref_name }}" --state open --json url -q '.[0].url' || echo "")
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV
          echo "PR URL: $PR_URL"  # Debugging line

      - name: Handle Labeling and Drafting PR based on Test Results
        if: github.event_name == 'push' && env.PR_URL != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if tests passed or failed..."
          
          # Debugging the file contents
          echo "Contents of pytest-status.txt: $(cat pytest-status.txt)"
          
          # Check if pytest passed or failed by checking the result file
          if test -f pytest-status.txt && grep -q "Tests failed" pytest-status.txt; then
            echo "❌ Unit tests failed. Moving PR back to draft and adding 'tests-failed' label."
            gh pr ready --undo "$PR_URL"
            gh pr comment "$PR_URL" --body "🚨 Unit tests failed. Moving PR back to draft."

            # Remove the 'tests-passed' label if it exists
            gh
