name: Run Pytest on PR

on:
  push:
    branches:
      - '**'  # Runs on all branches
  pull_request:
    types:
      - ready_for_review  # Trigger when PR is moved from draft to open
  workflow_dispatch:  # Allows manual execution of tests

permissions:
  pull-requests: write

jobs:

  e2e_tests:
    needs: unit_tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Verify PR is Open
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          # Fetch PR data using the correct command
          PR_STATE=$(gh pr view "${{ github.event.pull_request.number }}" --json state -q ".state")
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "❌ PR is not open. Cancelling E2E tests."
            exit 1
          else
            echo "✅ PR is open. Proceeding with E2E tests."
          fi

      - name: Run E2E Tests
        run: pytest e2etests.py
