name: Run Pytest on PR

on:
  push:
    branches:
      - '**'  # Runs on every push
  pull_request:
    types:
      - ready_for_review  # Trigger when PR moves from draft to open
  workflow_dispatch:  # Allows manual execution

permissions:
  pull-requests: write

jobs:

  unit_tests:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'tests-passed'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Unit Tests
        id: pytest
        run: pytest test_script.py

      - name: Get PR URL
        id: pr_url
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          PR_URL=$(gh pr list --head "${{ github.ref_name }}" --state open --json url -q '.[0].url' || echo "")
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV

      - name: Move PR to Draft & Add Label if Tests Fail
        if: failure() && github.event_name == 'push' && env.PR_URL != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "❌ Unit tests failed, moving PR back to draft."
          gh pr ready --undo "$PR_URL"
          gh pr comment "$PR_URL" --body "🚨 Unit tests failed in Draft. They will rerun when PR is reopened."
          gh pr edit "$PR_URL" --add-label "tests-failed"
          gh pr edit "$PR_URL" --remove-label "tests-passed"

      - name: Mark PR as Passed if Tests Succeed
        if: success() && github.event_name == 'push' && env.PR_URL != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          # Ensure the label exists before adding it
          gh api repos/${{ github.repository }}/labels --jq '.[].name' | grep -qx "tests-passed" || \
          gh api repos/${{ github.repository }}/labels -X POST -f name="tests-passed" -f color="0e8a16"
          # Add label and remove failure label if tests pass
          gh pr edit "$PR_URL" --add-label "tests-passed"
          gh pr edit "$PR_URL" --remove-label "tests-failed"
          gh pr comment "$PR_URL" --body "✅ Unit tests passed. They won't rerun when PR is reopened."

  e2e_tests:
    needs: unit_tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Verify PR is Open
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          PR_STATE=$(gh pr view "${{ github.event.pull_request.number }}" --json state -q ".state")
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "❌ PR is not open. Cancelling E2E tests."
            exit 1
          else
            echo "✅ PR is open. Proceeding with E2E tests."
          fi

      - name: Run E2E Tests
        run: pytest e2etests.py
