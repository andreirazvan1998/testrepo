name: Run Pytest on PR

on:
  push:
    branches:
      - '**'  # Runs on all branches
  pull_request:
    types:
      - ready_for_review  # Trigger when PR is moved from draft to open
  workflow_dispatch:  # Allows manual execution of tests

permissions:
  pull-requests: write

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'tests-passed'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Unit Tests
        id: pytest
        run: |
          echo "Running unit tests..."
          pytest test_script.py --maxfail=1 --disable-warnings --tb=short
          
      - name: Check Test Result and Set Labels
        id: set_labels
        run: |
          echo "Checking if tests passed or failed..."
          if [ $? -ne 0 ]; then
            echo "Test result: failure"
            echo "TEST_RESULT=failure" >> $GITHUB_ENV
          else
            echo "Test result: success"
            echo "TEST_RESULT=success" >> $GITHUB_ENV
          fi

      - name: Get PR URL (Only for push events)
        id: pr_url
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          PR_URL=$(gh pr list --head "${{ github.ref_name }}" --state open --json url -q '.[0].url' || echo "")
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV
          echo "PR URL: $PR_URL"  # Debugging line

      - name: Handle Labeling and Drafting PR based on Test Results
        if: github.event_name == 'push' && env.PR_URL != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking and handling labels and PR status..."
          
          # Check if the tests failed or passed
          if [[ "$TEST_RESULT" == "failure" ]]; then
            echo "Tests failed. Adding 'tests-failed' label to PR."
            gh pr edit "$PR_URL" --add-label "tests-failed"
            gh pr comment "$PR_URL" --body "❌ Unit tests failed! Please check the test logs."

            # Move the PR back to draft if the tests failed
            gh pr ready --undo "$PR_URL"
            exit 1  # Explicitly exit with error to indicate failure, this ensures the job fails
          else
            echo "Tests passed. Adding 'tests-passed' label to PR."
            gh pr edit "$PR_URL" --add-label "tests-passed"
            gh pr comment "$PR_URL" --body "✅ Unit tests passed. PR is ready for review."
          fi

  e2e_tests:
    needs: unit_tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Verify PR is Open
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          # Fetch PR data using the correct command
          PR_STATE=$(gh pr view "${{ github.event.pull_request.number }}" --json state -q ".state")
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "❌ PR is not open. Cancelling E2E tests."
            exit 1
          else
            echo "✅ PR is open. Proceeding with E2E tests."
          fi

      - name: Run E2E Tests
        run: pytest e2etests.py
