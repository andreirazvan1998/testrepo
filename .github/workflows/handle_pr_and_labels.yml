name: Handle PR and Labels

on:
  workflow_run:
    workflows: ["Run Unit Tests"]
    types:
      - completed

permissions:
  pull-requests: write

jobs:
  handle_labels:
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up GitHub CLI
        run: |
          gh auth setup-git

      - name: Get PR URL
        id: pr_url
        run: |
          PR_URL=$(gh pr list --head "${{ github.ref_name }}" --state open --json url -q '.[0].url' || echo "")
          
          if [ -z "$PR_URL" ]; then
            echo "❌ Could not find PR URL. Exiting."
            exit 1
          fi

          echo "PR_URL=$PR_URL" >> $GITHUB_ENV

      - name: Add 'tests-passed' or 'tests-failed' Label Based on Test Result
        run: |
          # Check if the previous job (unit_tests) failed or succeeded
          if [[ "${{ needs.unit_tests.result }}" == "success" ]]; then
            echo "Tests passed. Adding 'tests-passed' label."
            gh pr edit "$PR_URL" --add-label "tests-passed" || echo "Label 'tests-passed' already exists."
            gh pr comment "$PR_URL" --body "✅ Unit tests passed. PR is ready for review."
          else
            echo "Tests failed. Adding 'tests-failed' label."
            gh pr edit "$PR_URL" --add-label "tests-failed" || echo "Label 'tests-failed' already exists."
            gh pr comment "$PR_URL" --body "❌ Unit tests failed! Please check the test logs."
            # Optionally move PR to draft if tests failed
            gh pr ready --undo "$PR_URL" || echo "Failed to move PR to draft."
