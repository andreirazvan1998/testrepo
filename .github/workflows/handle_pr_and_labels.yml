name: Handle PR and Labels

on:
  push:
    branches:
      - '**'  # Runs on all branches
  pull_request:
    types:
      - ready_for_review  # Trigger when PR is moved from draft to open
  workflow_dispatch:  # Allows manual execution

permissions:
  pull-requests: write

jobs:
  unit_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Unit Tests
        id: pytest
        run: |
          pytest test_script.py
          echo "Test result: $?"

  handle_labels:
    runs-on: ubuntu-latest
    needs: unit_tests  # Ensure this job runs after unit_tests
    if: always()  # Ensure this job runs regardless of the result of the unit_tests job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up GitHub CLI authentication
        run: |
          # Ensure GitHub CLI is authenticated with the correct token
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get PR URL
        id: pr_url
        run: |
          PR_URL=$(gh pr list --head "${{ github.ref_name }}" --state open --json url -q '.[0].url')
          
          if [ -z "$PR_URL" ]; then
            echo "❌ Could not find PR URL. Exiting."
            exit 1
          fi
          
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV

      - name: Add 'tests-passed' or 'tests-failed' Label Based on Test Result
        run: |
          # Check the pytest exit code from the previous job
          if [[ ${{ needs.unit_tests.outputs.test-result }} -eq 0 ]]; then
            echo "Tests passed. Adding 'tests-passed' label."
            gh pr edit "$PR_URL" --add-label "tests-passed" || echo "Label 'tests-passed' already exists."
            gh pr comment "$PR_URL" --body "✅ Unit tests passed. PR is ready for review."
          else
            echo "Tests failed. Adding 'tests-failed' label."
            gh pr edit "$PR_URL" --add-label "tests-failed" || echo "Label 'tests-failed' already exists."
            gh pr comment "$PR_URL" --body "❌ Unit tests failed! Please check the test logs."
            # Optionally move PR to draft if tests failed
            gh pr ready --undo "$PR_URL" || echo "Failed to move PR to draft."
