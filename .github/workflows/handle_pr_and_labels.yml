name: Handle PR Labels Based on Test Result

on:
  push:
    branches:
      - '**'  # Runs on all branches
  pull_request:
    types:
      - ready_for_review  # Trigger when PR is moved from draft to open
  workflow_dispatch:  # Allows manual execution

permissions:
  pull-requests: write

jobs:
  pytest_and_labels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Unit Tests
        id: pytest
        continue-on-error: true  # Allow workflow to continue even if pytest fails
        run: |
          pytest test_script.py  # Run pytest and capture the result

      - name: Set GitHub CLI authentication
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get PR URL
        id: pr_url
        run: |
          PR_URL=$(gh pr list --head "${{ github.ref_name }}" --state open --json url -q '.[0].url')
          if [ -z "$PR_URL" ]; then
            echo "❌ Could not find PR URL. Exiting."
            exit 1
          fi
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV

      - name: Check for existing labels and replace them
        run: |
          # Check if 'tests-passed' label exists
          existing_labels=$(gh pr view "$PR_URL" --json labels -q '.labels[].name')
          if echo "$existing_labels" | grep -q "tests-passed"; then
            if [ "${{ steps.pytest.outcome }}" != "success" ]; then
              echo "Tests failed. Replacing 'tests-passed' with 'tests-failed' label."
              gh pr edit "$PR_URL" --remove-label "tests-passed" --add-label "tests-failed"
            fi
          elif echo "$existing_labels" | grep -q "tests-failed"; then
            if [ "${{ steps.pytest.outcome }}" == "success" ]; then
              echo "Tests passed. Replacing 'tests-failed' with 'tests-passed' label."
              gh pr edit "$PR_URL" --remove-label "tests-failed" --add-label "tests-passed"
            fi
          else
            if [ "${{ steps.pytest.outcome }}" == "success" ]; then
              echo "Tests passed. Adding 'tests-passed' label."
              gh pr edit "$PR_URL" --add-label "tests-passed"
            else
              echo "Tests failed. Adding 'tests-failed' label."
              gh pr edit "$PR_URL" --add-label "tests-failed"
            fi
          fi
