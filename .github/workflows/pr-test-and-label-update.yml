name: PR Test and Trigger JSON Manager

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-pr-test]
  push:
    branches:
      - '**'

jobs:
  run_pytest:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.pytest.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        id: pytest
        run: |
          pytest test_script.py
        shell: bash

  trigger_controlrepo:
    needs: run_pytest
    runs-on: ubuntu-latest
    if: always()  # Always run, even if tests fail

    steps:
      - name: Trigger controlrepo workflow
        run: |
          curl -X POST -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.CONTROLREPO_ACCESS_TOKEN }}" \
          https://api.github.com/repos/andreirazvan1998/controlrepo/dispatches \
          -d '{
            "event_type": "update-pr-status",
            "client_payload": {
              "pr_name": "${{ github.event.pull_request.title }}",
              "test_status": "${{ needs.run_pytest.outputs.result }}"
            }
          }'
