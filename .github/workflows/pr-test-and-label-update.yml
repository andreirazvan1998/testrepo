name: PR Test and Label Update

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  check_labels:
    runs-on: ubuntu-latest
    if: github.event.action == 'ready_for_review'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Authenticate with GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get PR Number
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Check PR Labels
        id: check
        run: |
          LABELS=$(gh pr view $PR_NUMBER --json labels -q '.labels[].name')
          echo "Current labels: $LABELS"
          if echo "$LABELS" | grep -q "tests-failed"; then
            echo "✅ Tests should run because 'tests-failed' label is present."
            echo "should_run=true" >> $GITHUB_ENV
            echo "::set-output name=should_run::true"
          else
            echo "❌ Tests are skipped as 'tests-failed' label is missing."
            echo "should_run=false" >> $GITHUB_ENV
            echo "::set-output name=should_run::false"

  run_pytest:
    runs-on: ubuntu-latest
    needs: check_labels
    if: github.event_name == 'push' || github.event.action != 'ready_for_review' || needs.check_labels.outputs.should_run == 'true'
    outputs:
      result: ${{ steps.test_status.outputs.result }}  # Correctly passing the test result

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        id: pytest
        continue-on-error: true  
        run: |
          pytest test_script.py
        shell: bash

      - name: Save test result
        id: test_status
        run: |
          if [ $? -eq 0 ]; then
            echo "::set-output name=result::success"
          else
            echo "::set-output name=result::failure"
          fi

  update_label:
    needs: run_pytest
    runs-on: ubuntu-latest
    if: always()  # Run regardless of pytest result
    steps:
      - name: Authenticate with GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get PR Number
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Update PR Label and Set Draft if Tests Fail
        run: |
          if [ "${{ needs.run_pytest.outputs.result }}" == "success" ]; then
            echo "✅ Tests passed! Setting label to 'tests-passed'"
            gh pr edit $PR_NUMBER --remove-label tests-failed || true
            gh pr edit $PR_NUMBER --add-label tests-passed
          else
            echo "❌ Tests failed! Setting label to 'tests-failed'"
            gh pr edit $PR_NUMBER --remove-label tests-passed || true
            gh pr edit $PR_NUMBER --add-label tests-failed

            # Move PR back to draft if needed
            PR_URL=$(gh pr view $PR_NUMBER --json url -q '.url')
            echo "🔄 Moving PR back to draft due to failed tests."
            gh pr ready --undo "$PR_URL"
