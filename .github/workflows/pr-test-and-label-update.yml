name: PR Test and Label Update

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  run_pytest:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.test_status.outputs.result }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        id: pytest
        continue-on-error: true  
        run: |
          pytest test_script.py
        shell: bash

      - name: Save test result
        id: test_status
        run: |
          if [ $? -eq 0 ]; then
            echo "result=success" >> $GITHUB_ENV
          else
            echo "result=failure" >> $GITHUB_ENV
          fi

  update_label:
    runs-on: ubuntu-latest
    needs: [run_pytest]
    if: always()
    steps:
      - name: Authenticate with GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get PR Number
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Get Test Result
        run: |
          TEST_RESULT="${{ needs.run_pytest.outputs.result }}"
          echo "Final test result: $TEST_RESULT"
          echo "TEST_RESULT=$TEST_RESULT" >> $GITHUB_ENV

      - name: Update PR Label and Set Draft if Tests Fail
        run: |
          if [[ "$TEST_RESULT" == "success" ]]; then
            echo "✅ Tests passed! Setting label to 'tests-passed'"
            gh pr edit $PR_NUMBER --remove-label tests-failed || true
            gh pr edit $PR_NUMBER --add-label tests-passed
          else
            echo "❌ Tests failed! Setting label to 'tests-failed'"
            gh pr edit $PR_NUMBER --remove-label tests-passed || true
            gh pr edit $PR_NUMBER --add-label tests-failed

            PR_URL=$(gh pr view $PR_NUMBER --json url -q '.url')
            echo "🔄 Moving PR back to draft due to failed tests."
            gh pr ready --undo "$PR_URL"
