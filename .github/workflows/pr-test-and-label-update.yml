name: PR Test and Label Update

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  check_labels:
    if: github.event.action == 'ready_for_review'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.run_tests }}
    
    steps:
      - name: Authenticate with GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get PR Number
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Check if 'tests-failed' label exists
        id: check
        run: |
          LABELS=$(gh pr view $PR_NUMBER --json labels -q '.labels[].name')
          echo "Current labels: $LABELS"
          if echo "$LABELS" | grep -q "tests-failed"; then
            echo "Tests previously failed. Running tests again."
            echo "run_tests=true" >> $GITHUB_ENV
            echo "::set-output name=run_tests::true"
          else
            echo "Tests previously passed. Skipping tests."
            echo "run_tests=false" >> $GITHUB_ENV
            echo "::set-output name=run_tests::false"

  run_pytest:
    runs-on: ubuntu-latest
    needs: check_labels
    if: github.event.action != 'ready_for_review' || needs.check_labels.outputs.should_run == 'true'
    outputs:
      result: ${{ steps.pytest.outcome }}  

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        id: pytest
        continue-on-error: true  
        run: |
          pytest test_script.py
        shell: bash

  update_label:
    needs: run_pytest
    runs-on: ubuntu-latest
    if: always()  
    steps:
      - name: Authenticate with GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get PR Number
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Update PR Label and Set Draft if Tests Fail
        run: |
          if [ "${{ needs.run_pytest.outputs.result }}" == "success" ]; then
            echo "✅ Tests passed! Setting label to 'tests-passed'"
            gh pr edit $PR_NUMBER --remove-label tests-failed || true
            gh pr edit $PR_NUMBER --add-label tests-passed
          else
            echo "❌ Tests failed! Setting label to 'tests-failed'"
            gh pr edit $PR_NUMBER --remove-label tests-passed || true
            gh pr edit $PR_NUMBER --add-label tests-failed

            # Move PR back to draft if needed
            PR_URL=$(gh pr view $PR_NUMBER --json url -q '.url')
            echo "🔄 Moving PR back to draft due to failed tests."
            gh pr ready --undo "$PR_URL"
