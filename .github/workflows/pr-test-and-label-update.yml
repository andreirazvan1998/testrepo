name: PR Test and Label Update

on:
  workflow_dispatch:  
  repository_dispatch:
    types: [trigger-pr-test]
  push:
    branches:
      - '**'

jobs:
  run_pytest:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.pytest.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        id: pytest
        continue-on-error: true
        run: |
          pytest test_script.py
        shell: bash

  update_label:
    needs: run_pytest
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate with GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get PR Number
        id: get_pr
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Create PR check status
        run: |
          if [ "${{ needs.run_pytest.outputs.result }}" == "success" ]; then
            echo "✅ Tests passed! Setting label to 'tests-passed'"
            gh pr edit $PR_NUMBER --remove-label tests-failed || true
            gh pr edit $PR_NUMBER --add-label tests-passed
            # Create a status check
            gh pr status --set "tests-passed"
          else
            echo "❌ Tests failed! Setting label to 'tests-failed'"
            gh pr edit $PR_NUMBER --remove-label tests-passed || true
            gh pr edit $PR_NUMBER --add-label tests-failed
            # Create a status check
            gh pr status --set "tests-failed"
            # Check if PR is open and move to draft
            PR_URL=$(gh pr list --head "${{ github.ref_name }}" --state open --json url -q '.[0].url')
            if [ -n "$PR_URL" ]; then
              echo "🔄 Moving PR back to draft due to failed tests."
              gh pr ready --undo "$PR_URL"
            fi
          fi
