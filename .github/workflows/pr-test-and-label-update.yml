on:
  pull_request:
    types: [opened, reopened]  # Runs only when PR is created or reopened
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-pr-test]
  push:
    branches:
      - '**'

jobs:
  run_pytest:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.pytest.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        id: pytest
        run: |
          pytest test_script.py
        shell: bash

  trigger_controlrepo:
    needs: run_pytest
    runs-on: ubuntu-latest
    if: always()  # Always run, even if tests fail

    steps:
      - name: Set PR Number (Handle Different Events)
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "PR_NUMBER=${{ github.event.client_payload.pr_number }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" == "push" ]; then
            PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
            echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          else
            echo "❌ No PR number found."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set test status variable
        id: set_test_status
        run: |
          if [ "${{ needs.run_pytest.outputs.result }}" == "success" ]; then
            echo "test_status=test-pass" >> $GITHUB_ENV
          else
            echo "test_status=test-failed" >> $GITHUB_ENV
          fi

      - name: Check if PR is already processed
        run: |
          if [ -f "pr_status.json" ]; then
            PR_EXISTS=$(jq 'has("PR-${{ env.PR_NUMBER }}")' pr_status.json)
            if [ "$PR_EXISTS" == "true" ]; then
              echo "⚠️ PR ${PR_NUMBER} already processed. Skipping the update."
              exit 0
            fi
          fi

      - name: Trigger controlrepo workflow
        run: |
          curl -X POST -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.CONTROLREPO_ACCESS_TOKEN }}" \
          https://api.github.com/repos/andreirazvan1998/controlrepo/dispatches \
          -d '{
            "event_type": "update-pr-status",
            "client_payload": {
              "action": "modify",
              "pr_name": "PR-${{ env.PR_NUMBER }}",
              "test_status": "'"${{ env.test_status }}"'"
            }
          }'
