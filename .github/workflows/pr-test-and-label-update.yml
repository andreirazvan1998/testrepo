name: PR Test and Label Update

on:
  workflow_dispatch:  # Allow manual trigger or external trigger via API
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  check_label:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check_label.outputs.run_tests }}  # Output to determine if pytest should run

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get PR Number
        id: get_pr
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Get current labels
        id: get_labels
        run: |
          # Explicitly set the GH_TOKEN for GitHub CLI
          export GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          LABELS=$(gh pr view $PR_NUMBER --json labels -q '.labels[].name')
          echo "Current labels: $LABELS"
          echo "LABELS=$LABELS" >> $GITHUB_ENV

      - name: Check if tests should run
        id: check_label
        run: |
          if [[ "${{ github.event.pull_request.state }}" == "open" ]] && [[ "$LABELS" == *"tests-failed"* ]]; then
            echo "Tests should run (PR is open and label is tests-failed)"
            echo "run_tests=true" >> $GITHUB_ENV
          else
            echo "Tests should NOT run (PR is not open or label is not tests-failed)"
            echo "run_tests=false" >> $GITHUB_ENV
          fi
          
  run_pytest:
    needs: check_label
    runs-on: ubuntu-latest
    if: ${{ needs.check_label.outputs.run_tests == 'true' }}  # Run only if check_label says so
    outputs:
      result: ${{ steps.pytest.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        id: pytest
        continue-on-error: true  # Continue even if tests fail
        run: |
          pytest test_script.py
        shell: bash

  update_label:
    needs: run_pytest
    runs-on: ubuntu-latest
    if: always()  # This will run no matter the outcome of pytest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate with GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get PR Number
        id: get_pr
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Get current labels
        id: get_labels
        run: |
          # Explicitly set the GH_TOKEN for GitHub CLI
          export GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          LABELS=$(gh pr view $PR_NUMBER --json labels -q '.labels[].name')
          echo "Current labels: $LABELS"
          echo "LABELS=$LABELS" >> $GITHUB_ENV

      - name: Update PR Label
        run: |
          if [ "${{ needs.run_pytest.outputs.result }}" == "success" ]; then
            echo "✅ Testele au trecut! Setăm eticheta 'tests-passed'"
            gh pr edit $PR_NUMBER --remove-label tests-failed || true
            gh pr edit $PR_NUMBER --add-label tests-passed
          else
            echo "❌ Testele au picat! Setăm eticheta 'tests-failed'"
            gh pr edit $PR_NUMBER --remove-label tests-passed || true
            gh pr edit $PR_NUMBER --add-label tests-failed
          fi
