name: Main Workflow

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  check_pr_label:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Check PR label and decide whether to run pytest
        id: check_label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Add the token for authentication
        run: |
          PR_LABEL=$(gh pr view ${{ github.event.pull_request.number }} --json labels -q ".labels[0].name")
          echo "Current label: $PR_LABEL"
          
          if [ "$PR_LABEL" == "tests-passed" ]; then
            echo "Tests passed, skipping pytest execution"
            echo "skip_tests=true" >> $GITHUB_ENV
          else
            echo "Tests failed or not run yet, running pytest"
            echo "skip_tests=false" >> $GITHUB_ENV

  run_tests:
    needs: check_pr_label
    runs-on: ubuntu-latest
    if: needs.check_pr_label.outputs.skip_tests == 'false'  # Only run pytest if not skipped
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run pytest
        run: |
          pytest tests/your_test_file.py
          
  handle_labels:
    needs: run_tests
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Add the token for authentication
    steps:
      - name: Set PR label based on pytest result
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "PR Number: $PR_NUMBER"
          
          # Check if pytest passed (exit code 0) or failed (exit code 1)
          if [ $? -eq 0 ]; then
            echo "Tests passed, updating label to 'tests-passed'"
            gh pr edit $PR_NUMBER --add-label tests-passed --remove-label tests-failed
          else
            echo "Tests failed, updating label to 'tests-failed'"
            gh pr edit $PR_NUMBER --add-label tests-failed --remove-label tests-passed
          fi
