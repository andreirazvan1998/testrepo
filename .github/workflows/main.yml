name: Run Pytest on PR

on:
  push:
    branches:
      - '**'  # Runs on all branches
  pull_request:
    types:
      - ready_for_review  # Trigger when PR is moved from draft to open
  workflow_dispatch:  # Allows manual execution of E2E tests

permissions:
  pull-requests: write

jobs:
  check_label_and_run_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up GitHub CLI
        run: |
          gh auth setup-git

      - name: Check PR label before running tests
        id: check_label
        run: |
          PR_STATE=$(gh pr view "${{ github.event.pull_request.number }}" --json state -q ".state")
          LABELS=$(gh pr view "${{ github.event.pull_request.number }}" --json labels -q ".labels[].name")
          echo "PR_STATE=$PR_STATE"
          echo "LABELS=$LABELS"

          # If PR is open and 'tests-passed' label exists, skip the test execution
          if [[ "$PR_STATE" == "OPEN" && "$LABELS" == *"tests-passed"* ]]; then
            echo "Tests have passed previously. Skipping pytest execution."
            echo "::set-output name=skip_tests::true"
          else
            echo "::set-output name=skip_tests::false"
          fi

  trigger_pytest:
    needs: check_label_and_run_tests
    runs-on: ubuntu-latest
    if: steps.check_label.outputs.skip_tests != 'true'  # Trigger pytest only if tests need to be run
    steps:
      - name: Trigger Pytest Workflow
        uses: peter-evans/workflow-dispatch@v1
        with:
          repository: ${{ github.repository }}
          workflow: run-pytest.yml  # Path to your pytest workflow file
          ref: ${{ github.sha }}
