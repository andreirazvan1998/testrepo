name: PR Test and Label Update

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  run_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pytest
        id: pytest
        run: |
          pytest tests/your_test_file.py || echo "Pytest failed with exit code $?" # Run pytest, capture failure if any

  update_label:
    needs: run_tests
    runs-on: ubuntu-latest
    if: ${{ always() }}  # Always runs, regardless of test result
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub Token to update labels
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set PR label based on pytest result
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "PR Number: $PR_NUMBER"
          
          # If pytest failed (exit code 1), set 'tests-failed' label
          if [ $? -eq 0 ]; then
            echo "Tests passed, updating label to 'tests-passed'"
            gh pr edit $PR_NUMBER --add-label tests-passed --remove-label tests-failed
          else
            echo "Tests failed, updating label to 'tests-failed'"
            gh pr edit $PR_NUMBER --add-label tests-failed --remove-label tests-passed
          fi
