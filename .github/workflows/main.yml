name: Main Workflow

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:  # Allows manual trigger for testing

jobs:
  check_pr_label:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Check PR label and decide whether to run pytest
        id: check_label
        run: |
          PR_LABEL=$(gh pr view ${{ github.event.pull_request.number }} --json labels -q ".labels[0].name")
          echo "Current label: $PR_LABEL"
          if [ "$PR_LABEL" == "tests-passed" ]; then
            echo "Tests passed, skipping pytest execution"
            echo "skip_tests=true" >> $GITHUB_ENV
          else
            echo "Tests failed or not run yet, running pytest"
            echo "skip_tests=false" >> $GITHUB_ENV

  run_tests:
    needs: check_pr_label
    runs-on: ubuntu-latest
    if: needs.check_pr_label.outputs.skip_tests == 'false'  # Only run pytest if not skipped
    steps:
      - name: Trigger pytest workflow
        uses: peter-evans/workflow-dispatch@v1
        with:
          workflow: run-pytest.yml
          ref: main
          inputs:
            run_pytest: true

  e2e_tests:
    needs: run_tests
    runs-on: ubuntu-latest
    if: needs.check_pr_label.outputs.skip_tests == 'true'  # Run e2e tests only if pytest is skipped
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run E2E tests
        run: |
          # Add your E2E tests commands here
          echo "Running E2E tests..."
