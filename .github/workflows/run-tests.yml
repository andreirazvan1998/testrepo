name: Run Unit Tests

on:
  push:
    branches:
      - '**'  # Runs on all branches
  pull_request:
    types:
      - ready_for_review  # Trigger when PR is moved from draft to open
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Unit Tests
        id: pytest
        run: |
          pytest test_script.py --maxfail=1 --disable-warnings --tb=short
          
      - name: Check Test Result
        id: test_result
        run: |
          echo "Checking if tests passed or failed..."
          if [ $? -ne 0 ]; then
            echo "TEST_RESULT=failure" >> $GITHUB_ENV
          else
            echo "TEST_RESULT=success" >> $GITHUB_ENV
