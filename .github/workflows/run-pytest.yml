name: PR Test and Label Update

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  run_pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        id: pytest
        run: |
          pytest test_script.py
          echo "Test status: $?"  # Afișează statusul testului

  update_label:
    needs: run_pytest
    runs-on: ubuntu-latest
    if: ${{ always() }}  # Se asigură că job-ul de actualizare a etichetei se va rula întotdeauna
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Token-ul GitHub pentru modificarea etichetelor
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get current labels
        id: get_labels
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          LABELS=$(gh pr view $PR_NUMBER --json labels -q '.labels | map(.name) | join(",")')
          echo "Current labels: $LABELS"
          echo "LABELS=$LABELS" >> $GITHUB_ENV

      - name: Set PR label based on pytest result
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "PR Number: $PR_NUMBER"
          
          # Verifică statusul pytest
          if [ "${{ steps.pytest.outcome }}" == "success" ]; then
            echo "Tests passed, setting 'tests-passed' label."
            # Elimină eticheta `tests-failed` dacă există
            if [[ "$LABELS" == *"tests-failed"* ]]; then
              echo "Removing 'tests-failed' label"
              gh pr edit $PR_NUMBER --remove-label tests-failed
            fi
            # Adăugăm `tests-passed` doar dacă nu există deja
            if [[ "$LABELS" != *"tests-passed"* ]]; then
              echo "Adding 'tests-passed' label"
              gh pr edit $PR_NUMBER --add-label tests-passed
            else
              echo "'tests-passed' label already present"
            fi
          else
            echo "Tests failed, setting 'tests-failed' label."
            # Elimină eticheta `tests-passed` dacă există
            if [[ "$LABELS" == *"tests-passed"* ]]; then
              echo "Removing 'tests-passed' label"
              gh pr edit $PR_NUMBER --remove-label tests-passed
            fi
            # Adăugăm `tests-failed` doar dacă nu există deja
            if [[ "$LABELS" != *"tests-failed"* ]]; then
              echo "Adding 'tests-failed' label"
              gh pr edit $PR_NUMBER --add-label tests-failed
            else
              echo "'tests-failed' label already present"
            fi
          fi
