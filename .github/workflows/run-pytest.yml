name: Run Pytest

on:
  workflow_dispatch:
    inputs:
      run_pytest:
        description: 'Run Pytest'
        required: true
        default: 'true'

jobs:
  pytest_execution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        id: pytest
        run: |
          pytest test_script.py
          echo "Test status: $?"

      - name: Set PR label based on pytest result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ${{ steps.pytest.outcome }} == 'success' ]; then
            echo "Tests passed, setting 'tests-passed' label."
            gh pr edit ${{ github.event.pull_request.number }} --add-label tests-passed
            gh pr edit ${{ github.event.pull_request.number }} --remove-label tests-failed
          else
            echo "Tests failed, setting 'tests-failed' label."
            gh pr edit ${{ github.event.pull_request.number }} --add-label tests-failed
            gh pr edit ${{ github.event.pull_request.number }} --remove-label tests-passed
          fi
