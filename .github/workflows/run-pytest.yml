name: Run Pytest

on:
  workflow_run:
    workflows: ["Main Workflow"]
    types:
      - completed

jobs:
  pytest_execution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        id: pytest
        run: |
          pytest test_script.py
          echo "Test status: $?"
        
      - name: Set PR label based on pytest result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking pytest result..."
          if [ ${{ steps.pytest.outcome }} == 'success' ]; then
            echo "Tests passed, setting 'tests-passed' label."
            gh label add tests-passed ${{ github.event.pull_request.url }}
            gh label remove tests-failed ${{ github.event.pull_request.url }}
          else
            echo "Tests failed, setting 'tests-failed' label."
            gh label add tests-failed ${{ github.event.pull_request.url }}
            gh label remove tests-passed ${{ github.event.pull_request.url }}
          fi
