name: PR Test and Label Update

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  check_label:
    runs-on: ubuntu-latest
    outputs:
      should_run_tests: ${{ steps.check.outputs.run_tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get current PR label
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          LABEL=$(gh pr view $PR_NUMBER --json labels -q ".labels[0].name")
          echo "Current label: $LABEL"
          
          if [[ "$LABEL" == "tests-passed" ]]; then
            echo "Tests already passed, skipping pytest."
            echo "run_tests=false" >> $GITHUB_OUTPUT
          else
            echo "Tests need to run."
            echo "run_tests=true" >> $GITHUB_OUTPUT
          fi

  run_pytest:
    needs: check_label
    if: needs.check_label.outputs.should_run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        id: pytest
        continue-on-error: true
        run: |
          pytest test_script.py
          echo "Test status: $?"
      
  update_label:
    needs: run_pytest
    runs-on: ubuntu-latest
    if: always()
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get current labels
        id: get_labels
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          LABELS=$(gh pr view $PR_NUMBER --json labels -q '.labels | map(.name) | join(",")')
          echo "Current labels: $LABELS"
          echo "LABELS=$LABELS" >> $GITHUB_ENV

      - name: Set PR label based on pytest result
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "PR Number: $PR_NUMBER"

          if [ ${{ steps.pytest.outcome }} == 'success' ]; then
            echo "Tests passed, updating label to 'tests-passed'."
            if [[ "$LABELS" == *"tests-failed"* ]]; then
              gh pr edit $PR_NUMBER --remove-label tests-failed
            fi
            if [[ "$LABELS" != *"tests-passed"* ]]; then
              gh pr edit $PR_NUMBER --add-label tests-passed
            fi
          else
            echo "Tests failed, updating label to 'tests-failed'."
            if [[ "$LABELS" == *"tests-passed"* ]]; then
              gh pr edit $PR_NUMBER --remove-label tests-passed
            fi
            if [[ "$LABELS" != *"tests-failed"* ]]; then
              gh pr edit $PR_NUMBER --add-label tests-failed
            fi
          fi
