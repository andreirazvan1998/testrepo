name: PR Test and Label Update

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  check_label:
    runs-on: ubuntu-latest
    outputs:
      should_run_tests: ${{ steps.check.outputs.run_tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate with GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get current PR label
        id: check
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          LABEL=$(gh pr view $PR_NUMBER --json labels -q ".labels[0].name")
          echo "Current label: $LABEL"
          
          if [[ "$LABEL" == "tests-passed" ]]; then
            echo "Tests already passed, skipping pytest."
            echo "run_tests=false" >> $GITHUB_OUTPUT
          else
            echo "Tests need to run."
            echo "run_tests=true" >> $GITHUB_OUTPUT

  run_pytest:
    needs: check_label
    if: needs.check_label.outputs.should_run_tests == 'true'
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.pytest.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        id: pytest
        continue-on-error: true
        run: |
          pytest test_script.py
        shell: bash

  update_label:
    needs: run_pytest
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate with GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get PR Number
        id: get_pr
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Get current labels
        id: get_labels
        run: |
          LABELS=$(gh pr view $PR_NUMBER --json labels -q '.labels[].name')
          echo "Current labels: $LABELS"
          echo "LABELS=$LABELS" >> $GITHUB_ENV

      - name: Update PR Label
        run: |
          if [ "${{ needs.run_pytest.outputs.result }}" == "success" ]; then
            echo "✅ Testele au trecut! Setăm eticheta 'tests-passed'"
            gh pr edit $PR_NUMBER --remove-label tests-failed || true
            gh pr edit $PR_NUMBER --add-label tests-passed
          else
            echo "❌ Testele au picat! Setăm eticheta 'tests-failed'"
            gh pr edit $PR_NUMBER --remove-label tests-passed || true
            gh pr edit $PR_NUMBER --add-label tests-failed
          fi
